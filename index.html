<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoQuest: Petualangan Robot Penyelamat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: #e0f2fe;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Fredoka One', cursive;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: white;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .grid-cell.wall { background-color: #475569; border-radius: 8px; }
        .grid-cell.lava { background-color: #fca5a5; }

        /* Style Blok Puzzle */
        .block {
            cursor: grab;
            user-select: none;
            transition: all 0.2s;
            position: relative;
            border-bottom: 4px solid rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .block::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 20px;
            width: 20px;
            height: 10px;
            background: inherit;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 10;
            display: none;
        }

        #program-area .block::after { display: block; }
        #program-area .block:last-child::after { display: none; }

        .block:active { cursor: grabbing; transform: scale(1.05); }
        
        .block-executing {
            outline: 4px solid #facc15;
            box-shadow: 0 0 20px #facc15;
            transform: scale(1.05);
            z-index: 20;
        }

        .code-slot {
            min-height: 150px;
            border: 3px dashed #cbd5e1;
            border-radius: 24px;
            background: #f1f5f9;
            transition: background 0.3s;
        }

        .code-slot.drag-over {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        /* Blok di area program dibuat lebih tipis agar tidak perlu scroll */
        #program-area .block {
            padding: 8px 12px;
            margin-bottom: 6px;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .robot-anim {
            animation: bounce-slow 2s infinite ease-in-out;
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
        }

        #trash-zone {
            transition: all 0.3s;
        }
        #trash-zone.drag-over {
            background: #fee2e2;
            transform: scale(1.1);
            color: #ef4444;
        }
    </style>
</head>
<body class="bg-blue-50">

    <div id="game-container" class="max-w-6xl mx-auto p-4 flex flex-col h-screen">
        <!-- Header -->
        <header class="flex justify-between items-center mb-4 bg-white p-4 rounded-3xl shadow-md border-b-4 border-blue-100">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-3 rounded-2xl text-white shadow-lg">
                    <i class="fas fa-robot text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl text-blue-600 leading-none">AlgoQuest</h1>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Akademi Kode Cilik</p>
                </div>
            </div>
            
            <div class="flex gap-3 items-center">
                <div class="bg-orange-100 px-6 py-2 rounded-2xl border-2 border-orange-400 font-bold text-orange-700 shadow-sm">
                    <i class="fas fa-star mr-2"></i> Level <span id="current-level-display">1</span>/5
                </div>
                <button onclick="resetLevel()" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-2xl text-slate-600 transition shadow-sm border-b-4 border-slate-300 active:border-b-0 active:translate-y-1">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </header>

        <main class="flex flex-1 gap-6 overflow-hidden pb-4">
            <!-- Area Pemrograman (Kiri) -->
            <div class="w-[45%] flex flex-col gap-4 overflow-hidden">
                <div class="bg-white p-5 rounded-[32px] shadow-xl flex flex-col border-b-8 border-slate-200 overflow-hidden flex-1">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-lg text-slate-700 flex items-center font-bold">
                            <i class="fas fa-toolbox mr-2 text-blue-500"></i> Kotak Perintah
                        </h3>
                    </div>
                    
                    <!-- Palet Blok - Dibuat 2 Kolom untuk menghemat tempat -->
                    <div id="block-palette" class="grid grid-cols-2 gap-2 mb-4">
                        <div class="block bg-blue-500 text-white shadow-md" draggable="true" data-type="move">
                            <i class="fas fa-walking"></i> Maju
                        </div>
                        <div class="block bg-indigo-500 text-white shadow-md" draggable="true" data-type="turn-right">
                            <i class="fas fa-arrow-rotate-right"></i> Kanan
                        </div>
                        <div class="block bg-indigo-500 text-white shadow-md" draggable="true" data-type="turn-left">
                            <i class="fas fa-arrow-rotate-left"></i> Kiri
                        </div>
                        <div class="block bg-purple-600 text-white shadow-md" draggable="true" data-type="loop-3">
                            <i class="fas fa-repeat"></i> Ulangi 3x
                        </div>
                    </div>

                    <h3 class="text-lg mb-2 text-slate-700 font-bold flex items-center">
                        <i class="fas fa-scroll mr-2 text-orange-500"></i> Urutan Langkahmu:
                    </h3>
                    
                    <!-- Drop Area Program - Overflow hidden agar tidak ada scroll manual yang muncul jika memungkinkan -->
                    <div id="program-area" class="flex-1 overflow-y-auto code-slot p-4 space-y-1">
                        <!-- Blok yang di-drop muncul di sini -->
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="flex gap-3 mt-4">
                        <button id="trash-zone" class="w-20 bg-slate-100 rounded-2xl flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-300">
                            <i class="fas fa-trash-can text-xl"></i>
                            <span class="text-[10px] font-bold">HAPUS</span>
                        </button>
                        <button id="run-btn" onclick="runProgram()" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl text-xl font-bold shadow-lg transition-all active:translate-y-1 active:border-b-0 border-b-8 border-green-700 flex items-center justify-center gap-3">
                            <i class="fas fa-play"></i> JALANKAN!
                        </button>
                    </div>
                </div>
            </div>

            <!-- Game Board (Kanan) -->
            <div class="flex-1 flex flex-col gap-4">
                <div class="bg-white p-6 rounded-[32px] shadow-xl flex-1 flex flex-col items-center justify-center relative border-b-8 border-slate-200">
                    <!-- Instruksi Level -->
                    <div class="absolute top-4 left-6 right-6 bg-blue-50 p-3 rounded-2xl border-l-4 border-blue-500">
                        <p class="text-sm font-bold text-blue-800"><i class="fas fa-info-circle mr-2"></i> <span id="mission-text">Misi: Bantu Robot!</span></p>
                    </div>

                    <div id="grid-board" class="grid gap-1.5 border-8 border-slate-100 p-2 bg-slate-50 rounded-2xl shadow-inner">
                        <!-- Grid cells will be generated here -->
                    </div>

                    <!-- Indikator Navigasi -->
                    <div class="absolute bottom-6 right-6 flex flex-col items-center gap-2">
                        <div class="bg-white/90 p-4 rounded-3xl border-2 border-blue-100 shadow-xl flex flex-col items-center">
                            <p class="text-[10px] font-bold text-slate-400 mb-1 uppercase">Hadap</p>
                            <div id="direction-arrow" class="text-2xl text-blue-600 transition-all duration-300">
                                <i class="fas fa-compass"></i>
                            </div>
                            <div id="direction-indicator" class="text-xs font-bold text-blue-600">UTARA</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="success-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white p-10 rounded-[40px] max-w-sm w-full text-center shadow-2xl border-b-8 border-blue-200">
            <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-trophy text-5xl text-yellow-500"></i>
            </div>
            <h2 class="text-3xl text-blue-600 mb-2">HEBAT!</h2>
            <p class="text-slate-500 font-bold mb-8" id="success-message">Algoritma kamu berhasil! Robot sangat senang.</p>
            <button onclick="nextLevel()" class="w-full bg-blue-500 text-white py-4 rounded-2xl font-bold text-xl hover:bg-blue-600 shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all">LEVEL SELANJUTNYA <i class="fas fa-arrow-right ml-2"></i></button>
        </div>
    </div>

    <div id="error-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white p-10 rounded-[40px] max-w-sm w-full text-center shadow-2xl border-b-8 border-red-100">
            <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-triangle-exclamation text-5xl text-red-500"></i>
            </div>
            <h2 class="text-3xl text-red-500 mb-2">Ayo Perbaiki!</h2>
            <p class="text-slate-500 font-bold mb-8" id="error-message">Robot menabrak sesuatu. Periksa lagi urutan perintahmu!</p>
            <button onclick="closeModals()" class="w-full bg-slate-700 text-white py-4 rounded-2xl font-bold text-xl hover:bg-slate-800 shadow-lg border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all">COBA LAGI</button>
        </div>
    </div>

    <script>
        // --- DATA LEVEL ---
        const LEVELS = [
            {
                id: 1, gridSize: 5, start: { x: 0, y: 4, dir: 0 }, end: { x: 4, y: 0 },
                walls: [{x:1, y:1}, {x:1, y:2}, {x:1, y:3}, {x:3, y:1}, {x:3, y:2}, {x:3, y:3}],
                lava: [], message: "Selamat Datang! Bantu Robot mengambil Kristal dengan jalan berbelok."
            },
            {
                id: 2, gridSize: 5, start: { x: 0, y: 4, dir: 0 }, end: { x: 4, y: 4 },
                walls: [{x:0, y:2}, {x:1, y:2}, {x:2, y:2}, {x:4, y:2}],
                lava: [{x:3, y:2}], message: "Hati-hati! Ada Lava panas (merah) yang tidak boleh diinjak!"
            },
            {
                id: 3, gridSize: 6, start: { x: 0, y: 5, dir: 1 }, end: { x: 5, y: 5 },
                walls: [{x:0, y:3}, {x:1, y:3}, {x:2, y:3}, {x:3, y:3}, {x:4, y:3}],
                lava: [], message: "Gunakan 'ULANGI' untuk berjalan jauh dengan lebih sedikit blok."
            },
            {
                id: 4, gridSize: 7, start: { x: 0, y: 6, dir: 0 }, end: { x: 6, y: 0 },
                walls: [{x:2, y:1}, {x:2, y:2}, {x:2, y:3}, {x:4, y:4}, {x:4, y:5}, {x:4, y:6}],
                lava: [{x:0, y:3}, {x:1, y:3}, {x:5, y:3}, {x:6, y:3}], message: "Labirin ini sangat rumit! Perhatikan arah hadap Robot."
            },
            {
                id: 5, gridSize: 5, start: { x: 0, y: 4, dir: 1 }, end: { x: 4, y: 0 },
                walls: [{x:2, y:2}, {x:1, y:1}, {x:3, y:3}],
                lava: [{x:0, y:0}, {x:4, y:4}, {x:2, y:0}, {x:2, y:4}], message: "Misi Terakhir! Kamu adalah Master Algoritma sejati!"
            }
        ];

        let currentLevelIndex = 0;
        let robotPos = { x: 0, y: 0, dir: 0 };
        let isRunning = false;

        // --- ENGINE GAME ---

        function initLevel() {
            const level = LEVELS[currentLevelIndex];
            robotPos = { ...level.start };
            
            document.getElementById('current-level-display').innerText = level.id;
            document.getElementById('mission-text').innerText = level.message;
            updateDirectionUI();

            const board = document.getElementById('grid-board');
            board.style.gridTemplateColumns = `repeat(${level.gridSize}, 1fr)`;
            board.innerHTML = '';

            for (let y = 0; y < level.gridSize; y++) {
                for (let x = 0; x < level.gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.id = `cell-${x}-${y}`;
                    cell.className = 'grid-cell w-12 h-12 md:w-16 md:h-16 shadow-sm border-2 border-slate-200';
                    
                    if (level.walls.some(w => w.x === x && w.y === y)) {
                        cell.classList.add('wall', 'bg-slate-600', 'border-slate-800');
                        cell.innerHTML = '<i class="fas fa-mountain text-slate-400 text-xl"></i>';
                    } else if (level.lava.some(l => l.x === x && l.y === y)) {
                        cell.classList.add('lava', 'bg-red-200', 'border-red-300');
                        cell.innerHTML = '<i class="fas fa-fire text-red-500 text-xl animate-pulse"></i>';
                    } else if (level.end.x === x && level.end.y === y) {
                        cell.innerHTML = '<div class="robot-anim"><i class="fas fa-gem text-yellow-400 text-3xl drop-shadow-md"></i></div>';
                    }
                    board.appendChild(cell);
                }
            }
            renderRobot();
        }

        function renderRobot() {
            const oldRobot = document.querySelector('.robot-entity');
            if (oldRobot) oldRobot.remove();

            const cell = document.getElementById(`cell-${robotPos.x}-${robotPos.y}`);
            const robot = document.createElement('div');
            robot.className = 'robot-entity absolute inset-0 flex items-center justify-center transition-all duration-300 z-30';
            
            const rotation = robotPos.dir * 90;
            robot.style.transform = `rotate(${rotation}deg)`;
            
            robot.innerHTML = `
                <div class="relative drop-shadow-2xl">
                    <i class="fas fa-robot text-blue-600 text-4xl"></i>
                    <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-red-500 rounded-full animate-ping"></div>
                </div>
            `;
            cell.appendChild(robot);
        }

        function updateDirectionUI() {
            const dirs = ["UTARA", "TIMUR", "SELATAN", "BARAT"];
            const arrows = ["fa-arrow-up", "fa-arrow-right", "fa-arrow-down", "fa-arrow-left"];
            
            const indicator = document.getElementById('direction-indicator');
            const arrowIcon = document.getElementById('direction-arrow');
            
            indicator.innerText = dirs[robotPos.dir];
            arrowIcon.innerHTML = `<i class="fas ${arrows[robotPos.dir]}"></i>`;
        }

        // --- LOGIKA PERINTAH ---

        async function runProgram() {
            if (isRunning) return;
            isRunning = true;
            
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> JALAN...';
            runBtn.classList.add('brightness-75');

            const blocks = document.querySelectorAll('#program-area .block');
            const commands = [];

            blocks.forEach((b, index) => {
                const type = b.getAttribute('data-type');
                if (type === 'loop-3') {
                    for(let i=0; i<3; i++) commands.push({ type: 'move', element: b });
                } else {
                    commands.push({ type, element: b });
                }
            });

            if (commands.length === 0) {
                showError("Program kosong! Tarik beberapa blok ke kotak urutan.");
                stopProgram();
                return;
            }

            for (let i = 0; i < commands.length; i++) {
                const cmd = commands[i];
                if (cmd.element) cmd.element.classList.add('block-executing');

                const success = await executeCommand(cmd);
                
                if (!success) {
                    if (cmd.element) cmd.element.classList.remove('block-executing');
                    showError();
                    stopProgram();
                    return;
                }

                await new Promise(r => setTimeout(r, 500));
                if (cmd.element) cmd.element.classList.remove('block-executing');
            }

            const level = LEVELS[currentLevelIndex];
            if (robotPos.x === level.end.x && robotPos.y === level.end.y) {
                showSuccess();
            } else {
                showError("Hampir sampai! Robot belum menyentuh Kristal.");
            }
            stopProgram();
        }

        async function executeCommand(cmd) {
            const level = LEVELS[currentLevelIndex];
            let newX = robotPos.x;
            let newY = robotPos.y;

            switch(cmd.type) {
                case 'move':
                    if (robotPos.dir === 0) newY--;
                    if (robotPos.dir === 1) newX++;
                    if (robotPos.dir === 2) newY++;
                    if (robotPos.dir === 3) newX--;
                    break;
                case 'turn-right':
                    robotPos.dir = (robotPos.dir + 1) % 4;
                    renderRobot();
                    updateDirectionUI();
                    return true;
                case 'turn-left':
                    robotPos.dir = (robotPos.dir + 3) % 4;
                    renderRobot();
                    updateDirectionUI();
                    return true;
            }

            if (newX < 0 || newX >= level.gridSize || newY < 0 || newY >= level.gridSize) return false;
            if (level.walls.some(w => w.x === newX && w.y === newY)) return false;
            
            if (level.lava.some(l => l.x === newX && l.y === newY)) {
                robotPos.x = newX;
                robotPos.y = newY;
                renderRobot();
                return false;
            }

            robotPos.x = newX;
            robotPos.y = newY;
            renderRobot();
            return true;
        }

        function stopProgram() {
            isRunning = false;
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = false;
            runBtn.innerHTML = '<i class="fas fa-play"></i> JALANKAN!';
            runBtn.classList.remove('brightness-75');
        }

        function showSuccess() {
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function showError(msg) {
            if (msg) document.getElementById('error-message').innerText = msg;
            else document.getElementById('error-message').innerText = "Robot menabrak tembok atau jatuh ke lava! Periksa urutan perintahmu.";
            document.getElementById('error-modal').classList.remove('hidden');
        }

        function closeModals() {
            document.getElementById('success-modal').classList.add('hidden');
            document.getElementById('error-modal').classList.add('hidden');
            resetLevel();
        }

        function nextLevel() {
            currentLevelIndex++;
            if (currentLevelIndex >= LEVELS.length) {
                alert("🏆 KAMU MENANG! Semua level berhasil diselesaikan.");
                currentLevelIndex = 0;
            }
            document.getElementById('success-modal').classList.add('hidden');
            document.getElementById('program-area').innerHTML = '';
            initLevel();
        }

        function resetLevel() {
            const level = LEVELS[currentLevelIndex];
            robotPos = { ...level.start };
            renderRobot();
            updateDirectionUI();
        }

        const programArea = document.getElementById('program-area');
        const trashZone = document.getElementById('trash-zone');

        document.querySelectorAll('#block-palette .block').forEach(b => {
            b.addEventListener('dragstart', e => {
                e.dataTransfer.setData('type', b.getAttribute('data-type'));
                e.dataTransfer.setData('source', 'palette');
                b.classList.add('opacity-50');
            });
            b.addEventListener('dragend', e => {
                b.classList.remove('opacity-50');
            });
        });

        programArea.addEventListener('dragover', e => {
            e.preventDefault();
            programArea.classList.add('drag-over');
        });

        programArea.addEventListener('dragleave', () => {
            programArea.classList.remove('drag-over');
        });

        programArea.addEventListener('drop', e => {
            e.preventDefault();
            programArea.classList.remove('drag-over');
            
            const type = e.dataTransfer.getData('type');
            const paletteBlock = document.querySelector(`#block-palette .block[data-type="${type}"]`);
            
            if (paletteBlock) {
                addBlockToProgram(type, paletteBlock.innerHTML, paletteBlock.className);
            }
        });

        function addBlockToProgram(type, html, className) {
            const newBlock = document.createElement('div');
            newBlock.className = className + ' cursor-pointer relative';
            newBlock.setAttribute('data-type', type);
            newBlock.innerHTML = html;
            newBlock.draggable = true;

            const deleteIndicator = document.createElement('div');
            deleteIndicator.className = 'absolute -right-2 -top-1 bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow-md border-2 border-white';
            deleteIndicator.innerHTML = '<i class="fas fa-times"></i>';
            newBlock.appendChild(deleteIndicator);

            newBlock.onclick = () => newBlock.remove();
            
            newBlock.addEventListener('dragstart', e => {
                e.dataTransfer.setData('action', 'delete');
                window.draggedBlock = newBlock;
            });

            programArea.appendChild(newBlock);
        }

        trashZone.addEventListener('dragover', e => {
            e.preventDefault();
            trashZone.classList.add('drag-over');
        });

        trashZone.addEventListener('dragleave', () => {
            trashZone.classList.remove('drag-over');
        });

        trashZone.addEventListener('drop', e => {
            e.preventDefault();
            trashZone.classList.remove('drag-over');
            if (window.draggedBlock) {
                window.draggedBlock.remove();
                window.draggedBlock = null;
            }
        });

        window.onload = initLevel;
    </script>
</body>
</html>
