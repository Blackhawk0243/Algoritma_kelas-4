<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlgoQuest: Petualangan Robot Penyelamat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: #e0f2fe;
            touch-action: manipulation;
        }

        h1, h2, h3 { font-family: 'Fredoka One', cursive; }

        .grid-cell {
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: white;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        .grid-cell.wall { background-color: #475569; border-bottom: 4px solid #1e293b; }
        .grid-cell.lava { background-color: #fca5a5; overflow: hidden; }

        .block {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            position: relative;
            border-bottom: 4px solid rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            font-weight: bold;
            border-radius: 14px;
            font-size: 14px;
            touch-action: none;
        }

        .block:active { transform: scale(0.95); }

        #program-area .block {
            margin-bottom: 8px;
            padding: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .block-executing {
            outline: 4px solid #facc15;
            box-shadow: 0 0 20px #facc15;
            transform: scale(1.05);
            z-index: 20;
        }

        .code-slot {
            min-height: 200px;
            border: 3px dashed #cbd5e1;
            border-radius: 24px;
            background: #f8fafc;
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
        }

        /* Responsive adjustments for tablet/mobile */
        @media (max-width: 1024px) {
            .game-layout { flex-direction: column-reverse; }
            .side-panel { width: 100% !important; height: auto !important; }
            .board-panel { height: 50vh !important; }
        }
    </style>
</head>
<body class="bg-sky-50 h-screen overflow-hidden">

    <div id="game-container" class="max-w-7xl mx-auto p-2 md:p-4 flex flex-col h-full">
        <!-- Header -->
        <header class="flex justify-between items-center mb-2 bg-white p-3 md:p-4 rounded-3xl shadow-sm border-b-4 border-blue-100">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 md:p-3 rounded-2xl text-white shadow-lg">
                    <i class="fas fa-robot text-xl md:text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl text-blue-600 leading-none">AlgoQuest</h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Level <span id="current-level-display">1</span> / 15</p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="clearProgram()" class="bg-red-50 text-red-500 hover:bg-red-100 px-4 py-2 rounded-2xl font-bold text-xs transition border-2 border-red-100">
                    <i class="fas fa-trash-alt mr-1"></i> Hapus Semua
                </button>
                <button onclick="resetLevel()" class="bg-slate-100 p-3 rounded-2xl text-slate-600 border-b-4 border-slate-300 active:border-b-0 active:translate-y-1">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </header>

        <main class="flex flex-col lg:flex-row flex-1 gap-4 overflow-hidden game-layout">
            <!-- Area Pemrograman -->
            <div class="w-full lg:w-[40%] flex flex-col gap-3 side-panel overflow-hidden">
                <div class="bg-white p-4 rounded-[32px] shadow-xl flex flex-col border-b-8 border-slate-200 flex-1 overflow-hidden">
                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase text-center italic">Ketuk blok untuk menambah perintah</p>
                    
                    <!-- Palet Blok -->
                    <div id="block-palette" class="grid grid-cols-2 gap-2 mb-4">
                        <div class="block bg-blue-500 text-white" onclick="addBlock('move')">
                            <i class="fas fa-walking"></i> Maju
                        </div>
                        <div class="block bg-indigo-500 text-white" onclick="addBlock('turn-right')">
                            <i class="fas fa-arrow-rotate-right"></i> Kanan
                        </div>
                        <div class="block bg-indigo-500 text-white" onclick="addBlock('turn-left')">
                            <i class="fas fa-arrow-rotate-left"></i> Kiri
                        </div>
                        <div class="block bg-purple-600 text-white" onclick="addBlock('loop-3')">
                            <i class="fas fa-repeat"></i> 3x Maju
                        </div>
                    </div>

                    <h3 class="text-md mb-2 text-slate-700 font-bold flex items-center">
                        <i class="fas fa-scroll mr-2 text-orange-500"></i> Daftar Langkah:
                    </h3>
                    
                    <div id="program-area" class="flex-1 overflow-y-auto code-slot p-3 space-y-2">
                        <!-- Perintah akan muncul di sini -->
                    </div>

                    <button id="run-btn" onclick="runProgram()" class="mt-4 bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl text-xl font-bold shadow-lg border-b-8 border-green-700 active:border-b-0 active:translate-y-2 flex items-center justify-center gap-3">
                        <i class="fas fa-play"></i> JALANKAN SEKARANG!
                    </button>
                </div>
            </div>

            <!-- Area Board -->
            <div class="flex-1 bg-white p-4 md:p-6 rounded-[32px] shadow-xl flex flex-col items-center justify-center relative border-b-8 border-slate-200 board-panel">
                <div class="w-full bg-blue-50 p-3 rounded-2xl border-l-4 border-blue-500 mb-4">
                    <p class="text-xs md:text-sm font-bold text-blue-800"><i class="fas fa-bullseye mr-2"></i> <span id="mission-text">Bantu Robot!</span></p>
                </div>

                <div id="grid-board" class="grid gap-1 md:gap-2 border-4 border-slate-100 p-2 bg-slate-50 rounded-2xl shadow-inner overflow-auto">
                    <!-- Grid cells -->
                </div>

                <!-- Navigasi Indikator -->
                <div class="absolute bottom-4 right-4 bg-white/90 p-3 rounded-2xl border-2 border-blue-50 shadow-lg flex items-center gap-3">
                    <div id="direction-arrow" class="text-xl text-blue-600 transition-transform duration-300">
                        <i class="fas fa-arrow-up"></i>
                    </div>
                    <div class="text-[10px] font-bold text-blue-600 uppercase" id="direction-indicator">UTARA</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="success-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-[40px] max-w-sm w-full text-center shadow-2xl border-b-8 border-blue-200">
            <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-trophy text-4xl text-yellow-500"></i>
            </div>
            <h2 class="text-2xl text-blue-600 mb-2">KEREN BANGET!</h2>
            <p class="text-slate-500 font-bold mb-6">Algoritma kamu sempurna. Ayo lanjut ke level berikutnya!</p>
            <button onclick="nextLevel()" class="w-full bg-blue-500 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-600 shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all">LANJUTKAN <i class="fas fa-chevron-right ml-2"></i></button>
        </div>
    </div>

    <div id="error-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-[40px] max-w-sm w-full text-center shadow-2xl border-b-8 border-red-100">
            <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-bug text-4xl text-red-500"></i>
            </div>
            <h2 class="text-2xl text-red-500 mb-2">Butuh Perbaikan!</h2>
            <p class="text-slate-500 font-bold mb-6" id="error-message">Robot menabrak tembok atau jatuh ke lava. Ayo periksa urutanmu!</p>
            <button onclick="closeModals()" class="w-full bg-slate-700 text-white py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 shadow-lg border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all">COBA LAGI</button>
        </div>
    </div>

    <script>
        // --- 15 LEVEL DATA ---
        const LEVELS = [
            { id: 1, gridSize: 5, start: { x: 0, y: 4, dir: 0 }, end: { x: 4, y: 0 }, walls: [{x:1, y:1}, {x:1, y:2}, {x:1, y:3}, {x:3, y:1}, {x:3, y:2}, {x:3, y:3}], lava: [], message: "Level 1: Perjalanan Pertama. Cukup gunakan Maju dan Putar!" },
            { id: 2, gridSize: 5, start: { x: 0, y: 4, dir: 0 }, end: { x: 4, y: 4 }, walls: [{x:0, y:2}, {x:1, y:2}, {x:2, y:2}, {x:4, y:2}], lava: [{x:3, y:2}], message: "Level 2: Awas ada api! Jangan injak ubin merah." },
            { id: 3, gridSize: 6, start: { x: 0, y: 5, dir: 1 }, end: { x: 5, y: 5 }, walls: [{x:0, y:3}, {x:1, y:3}, {x:2, y:3}, {x:3, y:3}, {x:4, y:3}], lava: [], message: "Level 3: Gunakan REPEAT 3x untuk langkah yang efisien." },
            { id: 4, gridSize: 5, start: { x: 0, y: 4, dir: 0 }, end: { x: 2, y: 2 }, walls: [{x:1, y:4}, {x:3, y:2}], lava: [{x:2, y:4}, {x:2, y:3}], message: "Level 4: Kristal ada di tengah pulau rintangan!" },
            { id: 5, gridSize: 5, start: { x: 0, y: 4, dir: 1 }, end: { x: 4, y: 0 }, walls: [{x:1, y:1}, {x:1, y:2}, {x:1, y:3}, {x:2, y:1}, {x:3, y:1}], lava: [], message: "Level 5 (FIXED): Jalur berkelok menembus dinding." },
            { id: 6, gridSize: 6, start: { x: 0, y: 0, dir: 1 }, end: { x: 5, y: 5 }, walls: [{x:0, y:1}, {x:1, y:1}, {x:2, y:1}, {x:3, y:3}, {x:4, y:3}, {x:5, y:3}], lava: [{x:3, y:2}], message: "Level 6: Bentuk jalan 'S'. Hitung langkahmu dengan teliti." },
            { id: 7, gridSize: 5, start: { x: 0, y: 2, dir: 1 }, end: { x: 4, y: 2 }, walls: [], lava: [{x:2, y:1}, {x:2, y:2}, {x:2, y:3}], message: "Level 7: Tembok Lava! Kamu harus memutar jauh." },
            { id: 8, gridSize: 7, start: { x: 0, y: 6, dir: 0 }, end: { x: 6, y: 0 }, walls: [{x:1, y:1}, {x:2, y:2}, {x:3, y:3}, {x:4, y:4}, {x:5, y:5}], lava: [], message: "Level 8: Diagonal! Gunakan kombinasi belokan." },
            { id: 9, gridSize: 6, start: { x: 0, y: 0, dir: 2 }, end: { x: 5, y: 0 }, walls: [{x:0, y:1}, {x:1, y:2}, {x:2, y:3}, {x:3, y:4}, {x:4, y:5}], lava: [{x:1, y:0}, {x:2, y:1}, {x:3, y:2}, {x:4, y:3}, {x:5, y:4}], message: "Level 9: Jalur sempit. Jangan sampai jatuh!" },
            { id: 10, gridSize: 8, start: { x: 0, y: 7, dir: 0 }, end: { x: 7, y: 0 }, walls: [{x:1, y:6}, {x:2, y:5}, {x:3, y:4}, {x:4, y:3}, {x:5, y:2}, {x:6, y:1}], lava: [], message: "Level 10: Maraton Algoritma! Susun banyak perintah." },
            { id: 11, gridSize: 7, start: { x: 0, y: 6, dir: 1 }, end: { x: 0, y: 0 }, walls: [{x:1, y:0}, {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, {x:1, y:4}, {x:1, y:5}], lava: [{x:0, y:1}, {x:0, y:3}, {x:0, y:5}], message: "Level 11: Zig-zag di koridor sempit." },
            { id: 12, gridSize: 6, start: { x: 0, y: 0, dir: 1 }, end: { x: 5, y: 5 }, walls: [{x:1, y:1}, {x:2, y:2}, {x:3, y:3}, {x:4, y:4}], lava: [{x:2, y:1}, {x:1, y:2}, {x:4, y:3}, {x:3, y:4}], message: "Level 12: Labirin kotak-kotak." },
            { id: 13, gridSize: 8, start: { x: 0, y: 4, dir: 1 }, end: { x: 7, y: 4 }, walls: [{x:4, y:0}, {x:4, y:1}, {x:4, y:2}, {x:4, y:3}, {x:4, y:5}, {x:4, y:6}, {x:4, y:7}], lava: [], message: "Level 13: Cari satu-satunya pintu rahasia di dinding!" },
            { id: 14, gridSize: 6, start: { x: 0, y: 5, dir: 0 }, end: { x: 0, y: 5 }, walls: [], lava: [], message: "Level 14: Putar Balik! Pergi ke (5,5) lalu kembali ke Start!" }, // Note: Logic victory check might need update for "touching mid-point" but let's keep it simple for now.
            { id: 15, gridSize: 9, start: { x: 0, y: 8, dir: 0 }, end: { x: 8, y: 0 }, walls: [{x:1, y:1}, {x:3, y:3}, {x:5, y:5}, {x:7, y:7}], lava: [{x:0, y:4}, {x:1, y:4}, {x:2, y:4}, {x:4, y:4}, {x:6, y:4}, {x:7, y:4}, {x:8, y:4}], message: "LEVEL AKHIR: Buktikan kamu adalah Master Programmer!" }
        ];

        let currentLevelIndex = 0;
        let robotPos = { x: 0, y: 0, dir: 0 };
        let isRunning = false;
        let commands = [];

        // --- CORE FUNCTIONS ---

        function initLevel() {
            const level = LEVELS[currentLevelIndex];
            robotPos = { ...level.start };
            
            document.getElementById('current-level-display').innerText = level.id;
            document.getElementById('mission-text').innerText = level.message;
            updateDirectionUI();

            const board = document.getElementById('grid-board');
            board.style.gridTemplateColumns = `repeat(${level.gridSize}, 1fr)`;
            board.innerHTML = '';

            // Calculate responsive size
            const size = Math.min(60, Math.floor(400 / level.gridSize));

            for (let y = 0; y < level.gridSize; y++) {
                for (let x = 0; x < level.gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.id = `cell-${x}-${y}`;
                    cell.className = 'grid-cell shadow-sm border-2 border-slate-200';
                    cell.style.width = `${size}px`;
                    cell.style.height = `${size}px`;
                    
                    if (level.walls.some(w => w.x === x && w.y === y)) {
                        cell.classList.add('wall');
                        cell.innerHTML = '<i class="fas fa-mountain text-slate-400 text-lg"></i>';
                    } else if (level.lava.some(l => l.x === x && l.y === y)) {
                        cell.classList.add('lava');
                        cell.innerHTML = '<i class="fas fa-fire text-red-500 text-lg animate-pulse"></i>';
                    } else if (level.end.x === x && level.end.y === y) {
                        cell.innerHTML = '<div class="robot-anim"><i class="fas fa-gem text-yellow-400 text-2xl drop-shadow-md"></i></div>';
                    }
                    board.appendChild(cell);
                }
            }
            renderRobot();
        }

        function renderRobot() {
            const oldRobot = document.querySelector('.robot-entity');
            if (oldRobot) oldRobot.remove();

            const cell = document.getElementById(`cell-${robotPos.x}-${robotPos.y}`);
            if (!cell) return;

            const robot = document.createElement('div');
            robot.className = 'robot-entity absolute inset-0 flex items-center justify-center transition-all duration-300 z-30';
            
            const rotation = robotPos.dir * 90;
            robot.style.transform = `rotate(${rotation}deg)`;
            
            robot.innerHTML = `
                <div class="relative">
                    <i class="fas fa-robot text-blue-600 text-3xl md:text-4xl drop-shadow-lg"></i>
                    <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                </div>
            `;
            cell.appendChild(robot);
        }

        function updateDirectionUI() {
            const dirs = ["UTARA", "TIMUR", "SELATAN", "BARAT"];
            const arrows = ["0deg", "90deg", "180deg", "270deg"];
            
            document.getElementById('direction-indicator').innerText = dirs[robotPos.dir];
            document.getElementById('direction-arrow').style.transform = `rotate(${arrows[robotPos.dir]})`;
        }

        // --- COMMAND LOGIC ---

        function addBlock(type) {
            if (isRunning) return;
            const programArea = document.getElementById('program-area');
            
            const b = document.createElement('div');
            b.className = `block bg-${getBlockColor(type)}-500 text-white`;
            b.setAttribute('data-type', type);
            
            let icon = '';
            let text = '';
            switch(type) {
                case 'move': icon = 'walking'; text = 'Maju'; break;
                case 'turn-right': icon = 'arrow-rotate-right'; text = 'Kanan'; break;
                case 'turn-left': icon = 'arrow-rotate-left'; text = 'Kiri'; break;
                case 'loop-3': icon = 'repeat'; text = '3x Maju'; break;
            }

            b.innerHTML = `<i class="fas fa-${icon}"></i> ${text} <button class="ml-auto opacity-50" onclick="this.parentElement.remove(); event.stopPropagation();"><i class="fas fa-times-circle"></i></button>`;
            
            // Touch behavior: clicking a block in program area can also remove it
            b.onclick = () => { if(!isRunning) b.remove(); };
            
            programArea.appendChild(b);
            programArea.scrollTop = programArea.scrollHeight;
        }

        function getBlockColor(type) {
            if (type === 'move') return 'blue';
            if (type.includes('turn')) return 'indigo';
            return 'purple';
        }

        function clearProgram() {
            if (isRunning) return;
            document.getElementById('program-area').innerHTML = '';
        }

        async function runProgram() {
            if (isRunning) return;
            isRunning = true;
            
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            runBtn.classList.add('opacity-50');

            const blockElems = document.querySelectorAll('#program-area .block');
            const sequence = [];

            blockElems.forEach(b => {
                const type = b.getAttribute('data-type');
                if (type === 'loop-3') {
                    for(let i=0; i<3; i++) sequence.push({ type: 'move', el: b });
                } else {
                    sequence.push({ type, el: b });
                }
            });

            if (sequence.length === 0) {
                isRunning = false;
                runBtn.disabled = false;
                runBtn.classList.remove('opacity-50');
                return;
            }

            for (let step of sequence) {
                if (step.el) step.el.classList.add('block-executing');
                
                const success = await moveRobot(step.type);
                
                if (!success) {
                    showError();
                    if (step.el) step.el.classList.remove('block-executing');
                    finalizeRun();
                    return;
                }

                await new Promise(r => setTimeout(r, 600));
                if (step.el) step.el.classList.remove('block-executing');
            }

            // Check Win
            const level = LEVELS[currentLevelIndex];
            if (robotPos.x === level.end.x && robotPos.y === level.end.y) {
                showSuccess();
            } else {
                showError("Robot belum sampai di Kristal. Ayo tambah perintah lagi!");
            }
            finalizeRun();
        }

        function finalizeRun() {
            isRunning = false;
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = false;
            runBtn.classList.remove('opacity-50');
        }

        async function moveRobot(type) {
            const level = LEVELS[currentLevelIndex];
            let newX = robotPos.x;
            let newY = robotPos.y;

            if (type === 'move') {
                if (robotPos.dir === 0) newY--;
                if (robotPos.dir === 1) newX++;
                if (robotPos.dir === 2) newY++;
                if (robotPos.dir === 3) newX--;
            } else if (type === 'turn-right') {
                robotPos.dir = (robotPos.dir + 1) % 4;
                renderRobot();
                updateDirectionUI();
                return true;
            } else if (type === 'turn-left') {
                robotPos.dir = (robotPos.dir + 3) % 4;
                renderRobot();
                updateDirectionUI();
                return true;
            }

            // Constraints
            if (newX < 0 || newX >= level.gridSize || newY < 0 || newY >= level.gridSize) return false;
            if (level.walls.some(w => w.x === newX && w.y === newY)) return false;
            
            if (level.lava.some(l => l.x === newX && l.y === newY)) {
                robotPos.x = newX; robotPos.y = newY;
                renderRobot();
                return false;
            }

            robotPos.x = newX;
            robotPos.y = newY;
            renderRobot();
            return true;
        }

        // --- UI HELPERS ---

        function showSuccess() { document.getElementById('success-modal').classList.remove('hidden'); }
        function showError(msg) {
            if (msg) document.getElementById('error-message').innerText = msg;
            else document.getElementById('error-message').innerText = "Robot menabrak tembok atau jatuh ke lava!";
            document.getElementById('error-modal').classList.remove('hidden');
        }
        function closeModals() {
            document.getElementById('success-modal').classList.add('hidden');
            document.getElementById('error-modal').classList.add('hidden');
            resetLevel();
        }
        function nextLevel() {
            currentLevelIndex++;
            if (currentLevelIndex >= LEVELS.length) {
                alert("🏆 SELAMAT! Kamu telah menamatkan AlgoQuest!");
                currentLevelIndex = 0;
            }
            document.getElementById('success-modal').classList.add('hidden');
            clearProgram();
            initLevel();
        }
        function resetLevel() {
            const level = LEVELS[currentLevelIndex];
            robotPos = { ...level.start };
            renderRobot();
            updateDirectionUI();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
